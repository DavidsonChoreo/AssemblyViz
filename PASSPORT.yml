passport: 1
app: assemblyviz
purpose: >
  A step-by-step visualizer for assembly code on the HYMN (8-bit) and RISC-V
  RV32I (32-bit) architectures, used to teach Computer Organization. Students
  write or load a program, then step through it and watch the registers and
  memory change. It replaces an unmaintained teaching tool from around 2005.
